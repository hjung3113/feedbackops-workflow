name: smoke

on: [push, pull_request]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bash .github/tests/release-contract.smoke.sh
      - run: NODE_OPTIONS= bash toolkit/scripts/__tests__/run-all.sh
